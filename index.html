<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>キャラクター呼称表</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <h1>キャラクター別　呼称表</h1>
    <h2>PROFILE</h2>
    <section id="profile"></section>

    <h2>呼称表</h2>
    <p class="notice">
      相手キャラクターの名前をクリックorタップで相手側のページに遷移
    </p>
    <section id="calling">
      <table>
        <thead>
          <tr>
            <th>Character</th>
            <th>呼び方</th>
            <th>呼ばれ方</th>
          </tr>
        </thead>

        <tbody id="calling-table"></tbody>
      </table>
    </section>

    <h2>Character List</h2>
    <p class="notice">
      相手キャラクターをクリックorタップで相手側のページに遷移
    </p>
    <section id="character-list"></section>

    <footer>Phase3</footer>
    <script src="main.js"></script>
  </body>
</html>
